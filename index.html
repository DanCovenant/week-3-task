<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pricing-container">

        <h1>Choose Your Plan</h1>
        <p class="subtitle">
            Simple pricing for every stage of your journey.
        </p>

        <div class="pricing-grid">

            <!-- Basic Plan -->
            <label class="pricing-card basic">

                <input type="radio" name="pricing" value="basic">

                <div class="header">
                    <h2>Basic</h2>
                    <p>Perfect for individuals starting out.</p>
                </div>

                <div class="price">
                    <h3>$9 <span>/ month</span></h3>
                    <p>Essential tools to get started.</p>
                </div>

                <ul class="features">
                    <li>1 website</li>
                    <li>5 GB storage</li>
                    <li>Email support</li>
                    <li>Basic analytics</li>
                </ul>

                <div class="action">
                    <button type="button">Choose Basic</button>
                </div>

            </label>


            <!-- Pro Plan -->
            <label class="pricing-card pro">

                <input type="radio" name="pricing" value="pro" checked>

                <span class="badge">MOST POPULAR</span>

                <div class="header">
                    <h2>Professional</h2>
                    <p>
                        Great for growing businesses that need
                        more flexibility and powerful tools.
                    </p>
                </div>

                <div class="price">
                    <h3>$29 <span>/ month</span></h3>
                    <p>More power for your growth.</p>
                </div>

                <ul class="features">
                    <li>5 websites</li>
                    <li>50 GB storage</li>
                    <li>Priority email support</li>
                    <li>Advanced analytics and reports</li>
                    <li>Custom integrations</li>
                </ul>

                <div class="action">
                    <button type="button">Choose Pro</button>
                </div>

            </label>


            <!-- Premium Plan -->
            <label class="pricing-card premium">

                <input type="radio" name="pricing" value="premium">

                <div class="header">
                    <h2>Premium</h2>
                    <p>
                        For teams and established businesses
                        that require advanced features and room
                        to scale.
                    </p>
                </div>

                <div class="price">
                    <h3>$59 <span>/ month</span></h3>
                    <p>The complete business solution.</p>
                </div>

                <ul class="features">
                    <li>Unlimited websites</li>
                    <li>200 GB storage</li>
                    <li>24/7 premium support</li>
                    <li>Advanced analytics</li>
                    <li>Custom integrations</li>
                    <li>Team collaboration tools</li>
                </ul>

                <div class="action">
                    <button type="button">Choose Premium</button>
                </div>

            </label>

        </div>

    </div>

</body>
</html>
